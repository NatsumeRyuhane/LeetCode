<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>COACH // TRAINING RECORD</title>
    <script>
      // Apply the stored theme before first paint, so a dark-mode user never
      // sees a white flash. Default is light; the OS setting is not consulted.
      try {
        var t = localStorage.getItem('coach:theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1117'/%3E%3Cpath d='M2.5 11.5v-7h3M6.5 11.5h3M13.5 4.5h-3v7' stroke='%232f81f7' fill='none' stroke-width='1'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
